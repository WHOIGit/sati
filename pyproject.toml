[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sati"
version = "0.1.0"
description = "SATI: slice-aware training and inference for object detection in very large images"
authors = [{ name = "Sidney Batchelder" }]
license = "MIT"
requires-python = ">=3.12"
# Core deps per DESIGN-DOC-v1 §11; ultralytics is an extra so prepare/inspect and the
# synth builder work without pulling torch.
dependencies = [
    "pydantic>=2.7",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "typer>=0.12",
    "rich>=13",
    "pyarrow>=16",
    "numpy>=1.26",
    "shapely>=2.0",
    "opencv-python>=4.9",
    "PyYAML>=6",
    "coolname>=5"
]

[project.optional-dependencies]
# Pinned range per DESIGN-DOC-v1 §7 NOTE; the coordinate-contract tripwire test guards it.
ultralytics = ["ultralytics>=8.3,<9"]
# synth_dataset_builder stage-1 extras beyond core (numpy/opencv/shapely/typer/rich/
# pyarrow/pydantic/PyYAML are already core deps). See DESIGN-DOC-SYNTH §10.
synth = [
    "scikit-image>=0.24",
    "pycocotools>=2.0.8",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
sati = "sati.cli:main"
sati-synth = "synth_dataset_builder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sati", "src/synth_dataset_builder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
