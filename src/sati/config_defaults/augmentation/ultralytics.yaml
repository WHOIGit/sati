# @package training.yolo_augment
# Reproduce Ultralytics' stock train-time augmentation. Opt in from an
# experiment with:
#   defaults:
#     - /augmentation@training.yolo_augment: ultralytics
# Values captured from Ultralytics 8.4.102 `get_cfg()` defaults.
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
translate: 0.1
scale: 0.5
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
close_mosaic: 10
auto_augment: randaugment
erasing: 0.4
