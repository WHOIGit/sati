# @package _global_
# Manual COCO bbox experiment using the derived no-unsure annotation file.
# Baseline: SATI augmentation is fully off (schema default). See augments.yaml
# for a variant that re-enables flips on top of this.

defaults:
  - /base: default
  - /data: coco
  - /model: yolo26n
  - /slicing: default
  - /recombination: default
  - /prediction: default
  - /training: default
  - _self_

experiment:
  name: v1/manual/baseline

data:
  source:
    uri: datasets/coco-ichthyoliths-manual/project6_fullres_no-unsure_coco.json
    image_root: datasets/coco-ichthyoliths-manual/images
    split_file: configs/experiment/v1/manual/all_fullframes_split.toml

model:
  num_classes: 4
  imgsz: null

slicing:
  nominal_slice_size: 1024
  overlap_ratio: 0.10
  min_area_ratio: 0.20
  size_gate_px: 16
  image_format: png
  max_levels: null
  level_policy:
    kind: start_then_geometric
    start_scale: 0.5
    subsequent_downsample_factor: 3.0
    stop_when_long_side_lte_nominal: true

training:
  epochs: 100
  patience: 10
  batch: 64
  lr: null
  device: null

recombination:
  # Pinned to pre-change v1 behavior (recombination-match-and-merge D5): the
  # packaged defaults moved to intersection-over-smaller / class-agnostic at 0.8.
  # This experiment keeps class-aware IoU 0.5 so it remains the ablation reference.
  method: nms
  match_metric: intersection_over_union
  within_level_threshold: 0.5
  cross_level_threshold: 0.5
  max_merge_growth: 8.0
  confidence_threshold: 0.05
  class_agnostic: false
