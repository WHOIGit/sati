# @package _global_
# Combined manual + sam2dirty fullframe set, using the 2026-08-06 COCO export
# (project11-coco.json), with the augments.yaml augmentation set (left-right
# and up-down flips, plus mild HSV photometric jitter).

defaults:
  - /base: default
  - /data: coco
  - /model: yolo26n
  - /slicing: default
  - /recombination: default
  - /training: default
  - _self_

experiment:
  name: v1/combo1/default

data:
  source:
    uri: datasets/coco-ichthyoliths-2026-08-06/project11-coco.json
    image_root: datasets/coco-ichthyoliths-2026-08-06/images
    split_file: configs/experiment/v1/combo1/all_fullframes_split.toml

model:
  num_classes: 4
  imgsz: null

slicing:
  nominal_slice_size: 1024
  overlap_ratio: 0.10
  min_area_ratio: 0.20
  size_gate_px: 16
  image_format: png
  max_levels: null
  level_policy:
    kind: start_then_geometric
    start_scale: 0.25
    subsequent_downsample_factor: 3.0
    stop_when_long_side_lte_nominal: true

training:
  epochs: 100
  patience: 20
  batch: 20
  lr: null
  device: null
  yolo_augment:
    flipud: 0.5
    fliplr: 0.5
    hsv_h: 0.01
    hsv_s: 0.2
    hsv_v: 0.2

recombination:
  # Pinned to pre-change v1 behavior (recombination-match-and-merge D5): the
  # packaged defaults moved to intersection-over-smaller / class-agnostic at 0.8.
  # This experiment keeps class-aware IoU 0.5 so it remains the ablation reference.
  method: nms
  match_metric: intersection_over_union
  within_level_threshold: 0.5
  cross_level_threshold: 0.5
  max_merge_growth: 8.0
  confidence_threshold: 0.05
  class_agnostic: false
