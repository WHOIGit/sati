# @package _global_
# combo1b/greedy_nmm: identical to combo1b/default except `method: greedy_nmm`,
# so `recombination_hash` is the only identity that moves between the two.
#
# The single-variable control for merge-vs-suppress (D15): merging ships selectable
# rather than default (D16), and this arm decides promotion on mAP.
# `max_merge_growth` only fires here.
#
# Recombination is infer/eval-time policy, so this runs against combo1b/default's
# checkpoint — no training of its own.

defaults:
  - /base: default
  - /data: coco
  - /model: yolo26m
  - /slicing: default
  - /recombination: default
  - /prediction: default
  - /rendering: default
  - /training: default
  - _self_

experiment:
  name: v1/combo1b/greedy_nmm

data:
  source:
    uri: datasets/coco-ichthyoliths-2026-08-06/project11-coco.json
    image_root: datasets/coco-ichthyoliths-2026-08-06/images
    # combo1's split verbatim, not a copy — a copy could drift and turn a
    # controlled A/B into two unrelated experiments
    split_file: configs/experiment/v1/combo1/all_fullframes_split.toml

model:
  num_classes: 4
  imgsz: null

slicing:
  nominal_slice_size: 1024
  overlap_ratio: 0.10
  min_area_ratio: 0.20
  size_gate_px: 16
  image_format: png
  max_levels: null
  level_policy:
    kind: start_then_geometric
    start_scale: 0.4
    subsequent_downsample_factor: 3.0
    stop_when_long_side_lte_nominal: true

training:
  epochs: 100
  patience: 20
  batch: 20
  lr: null
  device: null
  yolo_augment:
    flipud: 0.5
    fliplr: 0.5
    hsv_h: 0.01
    hsv_s: 0.2
    hsv_v: 0.2

recombination:
  method: greedy_nmm
  match_metric: intersection_over_smaller
  within_level_threshold: 0.8
  cross_level_threshold: 0.8
  max_merge_growth: 8.0
  confidence_threshold: 0.05
  class_agnostic: true

# Overlays for this arm (infer-render-artifacts). Rendering contributes to no hash,
# so enabling it here keeps every identity provably equal to the arm it is compared
# against -- the whole point of turning it on inside a controlled A/B.
rendering:
  enabled: true
  style_config: src/sati/config_defaults/rendering/style-example.toml
